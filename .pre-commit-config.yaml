fail_fast: false

exclude: |
  (?x)^(
    \.idea/.*
  )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/crate-ci/typos
    rev: bee27e3a4fd1ea2111cf90ab89cd076c870fce14 # frozen: v1.48.0
    hooks:
      - id: typos

  - repo: local
    hooks:
      # yaml, and the json and javascript the vs code extension is made of.
      # what it formats, and how, is in `dprint.jsonc` — that file is the
      # scope, so this runs the whole set rather than the changed files, and
      # the two cannot disagree
      - id: dprint
        name: dprint
        entry: dprint fmt
        language: node
        additional_dependencies: ["dprint@0.55.2"]
        files: '\.(ya?ml|json|jsonc|m?js|toml|py|md)$'
        pass_filenames: false

      - id: rustfmt
        name: rustfmt
        entry: cargo fmt --all --
        language: system
        types: [rust]
        pass_filenames: false

      - id: check-docs-nav
        name: check the docs nav
        entry: uv run --no-project --python 3.13 python scripts/check_docs_nav.py
        language: system
        files: '^(docs/.*\.md|zensical\.toml|scripts/check_docs_nav\.py)$'
        pass_filenames: false
