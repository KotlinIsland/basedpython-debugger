# the IntelliJ Platform bundles its own kotlin standard library, and the gradle
# kotlin plugin adds another one. two of them on a plugin's classpath is a
# `ClassNotFoundException` or a version mismatch at runtime, and
# `verifyPluginProjectConfiguration` reports it
kotlin.stdlib.default.dependency=false

# the platform test framework starts a whole IDE in the test jvm
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
