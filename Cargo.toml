[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97"
version = "0.0.1-a1"
publish = false
license = "MIT"
repository = "https://github.com/KotlinIsland/basedpython-debugger"

[workspace.dependencies]
bpd_core = { path = "crates/bpd_core" }
bpd_dap = { path = "crates/bpd_dap" }
bpd_mcp = { path = "crates/bpd_mcp" }
bpd_protocol = { path = "crates/bpd_protocol" }
bpd_engine = { path = "crates/bpd_engine" }
bpd_test = { path = "crates/bpd_test" }

clap = { version = "4.5", features = ["derive", "wrap_help"] }
getrandom = "0.4"
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
pyo3 = { version = "0.29", features = ["extension-module"] }
pyo3-build-config = "0.29"
rustix = { version = "1.1", features = ["event", "process"] }
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
# a wheel is a zip, and `bpd_release` is the only crate that writes one. stored
# entries only — no compression backend, so this pulls nothing further in
zip = { version = "2", default-features = false }
serde_json = "1.0"
tempfile = "3.24"
thiserror = "2.0"

[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"
missing_docs = "warn"
unused_qualifications = "warn"

# a doc comment that points at something no longer there is how a stale claim
# stays invisible, and nothing in the gate said so: clippy does not run
# rustdoc's lints and nothing else ran `cargo doc`. it turned up a link to an
# enum that has never existed in this history
#
# only the broken-link lint, which is the one that catches a doc pointing at
# something that is not there. `private_intra_doc_links` is a stylistic concern
# and this tree links to private items on purpose
[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -2 }

# allowed pedantic lints. everything not listed here is on
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"
single_match_else = "allow"

# the placeholder ban, enforced. these are the two macros that exist purely to
# mark work that was not done, and a feature is fully implemented or absent
todo = "deny"
unimplemented = "deny"

# failing loudly means never discarding a result or unwrapping without a stated
# reason. `expect` stays available — its message is the justification
unwrap_used = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"

# restriction lints that catch quiet wrongness
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"
exit = "warn"
get_unwrap = "warn"
iter_over_hash_type = "warn"
mem_forget = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
rest_pat_in_fully_bound_structs = "warn"
verbose_file_reads = "warn"

# nursery
debug_assert_with_mut_call = "warn"
redundant_clone = "warn"
unused_peekable = "warn"

[profile.release]
lto = "fat"
codegen-units = 1

# a cold `cargo test --workspace` took eighty minutes at nineteen percent cpu.
# almost none of that was compilation: the same suite against a fresh target
# directory is 143 seconds, of which 140 are the tests themselves. the eighty
# minutes was `target/debug/deps` holding 925,503 entries — around 138 stale
# generations of object files, where one build needs 6,707. apfs degrades
# superlinearly at that count, and every cargo, rustc and ld invocation pays it
# on every file it touches. a bare `ls` of that directory took 55 seconds for 14
# of cpu, which is the same low-cpu high-sys signature the build had
#
# they accumulate because `split-debuginfo` defaults to `unpacked` on macos:
# rustc leaves one `.o` per codegen unit next to the binary and the linker
# records only a debug map pointing at them, so nothing ever collects the
# previous build's. `packed` gathers them into a `.dSYM` and retains none, which
# buys a bounded directory for a slower cold build and a larger target
[profile.dev]
split-debuginfo = "packed"

# `line-tables-only` keeps the file and line of every frame, which is what a
# failing test's backtrace is read for. what it drops is the type and variable
# dwarf, which nothing reads outside an lldb session on `bpd`'s own rust — and
# that is recovered with `RUSTFLAGS="-C debuginfo=2"` for the one build that
# wants it, rather than paid for by every build that does not
debug = "line-tables-only"

# and none at all for the hundred crates underneath. stepping into serde or
# pyo3's internals is not something this project debugs, so their debug info was
# generated, linked and never read. `*` is dependencies only — the workspace's
# own crates keep the line tables set above, and must, because `debug = 0` drops
# the `at file:line` from a backtrace without saying so
[profile.dev.package."*"]
debug = 0
