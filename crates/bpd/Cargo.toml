[package]
name = "bpd"
description = "a debugger for python and basedpython"
edition = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }
publish = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

[[bin]]
name = "bpd"
path = "src/main.rs"

[dependencies]
bpd_core = { workspace = true }
bpd_dap = { workspace = true }
bpd_mcp = { workspace = true }
bpd_engine = { workspace = true }

clap = { workspace = true }

[dev-dependencies]
bpd_test = { workspace = true }

criterion = { workspace = true }
serde_json = { workspace = true }
# `tests/agents.rs` names the cache entry an agent stages into, which is the
# sha-256 of its bytes. computing it is what makes "this interpreter was given
# the file under *its* tag" an assertion rather than an inference
sha2 = { workspace = true }
tempfile = { workspace = true }

# the whole-process comparison: a program run bare, under bpd, and under
# debugpy. it drives the `bpd` binary above through DAP, which is why it lives
# in this crate rather than beside the engine
[[bench]]
name = "overhead"
harness = false

[lints]
workspace = true
