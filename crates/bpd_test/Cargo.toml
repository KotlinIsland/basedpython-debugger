[package]
name = "bpd_test"
description = "test support: finding and running the real interpreters bpd is tested against"
edition = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }
publish = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

[dependencies]
bpd_core = { workspace = true }
bpd_engine = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }

# a pseudo-terminal, for the half of launch parity a pipe cannot measure. std
# has no way to open one and no `unsafe`-free path to `forkpty`; this is the
# wrapper, and `NOCTTY` on every open is what keeps a controlling terminal out
# of it
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs", "pty"] }

[lints]
workspace = true
