[package]
name = "bpd_engine"
description = "owns debuggee processes and the control plane to their agents"
edition = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }
publish = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

[dependencies]
bpd_core = { workspace = true }
bpd_protocol = { workspace = true }

getrandom = { workspace = true }
# a debug script's byte budget is measured as the json one record serialises
# to. the unit has to be something, both front ends render json, and json is
# what spends the context window the budget exists to protect
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }

# std has no `geteuid`, and the agent cache is refused unless the directory
# belongs to the user whose processes will load what is in it
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }

[dev-dependencies]
bpd_test = { workspace = true }

serde_json = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
