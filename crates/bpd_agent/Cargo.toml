[package]
name = "bpd_agent"
description = "the native agent loaded into the debuggee"
edition = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }
publish = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

[lib]
name = "bpd_agent"
# the interpreter loads this as an extension module. there is no rlib, because
# nothing in the workspace links it — the engine stages the built artifact and
# the interpreter imports it
crate-type = ["cdylib"]
# `cargo bench` otherwise builds this lib as a benchmark harness and runs it as
# an ordinary executable. it is a cpython extension module: the cpython symbols
# it references are supposed to come from the interpreter that loads it, so the
# harness aborts in dyld before main, and `cargo bench --workspace` fails before
# it reaches a benchmark. there are none here to lose. the *test* harness is
# left on — `cargo test` runs the three unit tests in `conditions`
bench = false

[dependencies]
bpd_core = { workspace = true }
bpd_protocol = { workspace = true }

pyo3 = { workspace = true }

# the reader thread waits on the control connection *and* on a wakeup, so that
# a fork can take it off the process and put it back. `poll` is the wait, and
# `fork` is posix — there is nothing on windows for either half to be the
# answer to
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }

[dev-dependencies]
bpd_test = { workspace = true }

[build-dependencies]
pyo3-build-config = { workspace = true }

[lints]
workspace = true
