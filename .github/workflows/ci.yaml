name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # the agent is not abi3, so every rust build compiles it against one specific
  # interpreter. `python` is whatever setup-python put first on PATH, which is
  # the matrix entry for that job. this overrides the default in
  # `.cargo/config.toml`
  PYO3_PYTHON: python

jobs:
  lint:
    name: fmt, clippy, hooks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: uvx prek run --all-files --show-diff-on-failure

  test:
    name: test ${{ matrix.os }} / python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # every supported interpreter on every platform. the free-threaded build
        # is a separate target rather than a variant, so it gets its own entry —
        # on two platforms, because its threading and its allocator differ by
        # more between linux and macos than the gil build's do
        #
        # 3.15 is here while it is still a release candidate, deliberately. the
        # policy is that a release is a possible behaviour change to the event
        # model rather than a compatibility exercise, and the only way that is
        # true is if the release is being run against before it ships — 3.15
        # moved a function's implicit `return None` onto `LOAD_COMMON_CONSTANT`,
        # which the restart allow lists did not name, and 14065 of its 33030
        # stdlib code objects silently lost the exit a frame is forced out
        # through. the allow list failed closed and no answer was wrong, and
        # nobody would have known until it shipped
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.13", "3.14", "3.15"]
        include:
          - os: ubuntu-latest
            python: "3.14t"
          - os: macos-latest
            python: "3.14t"
          - os: ubuntu-latest
            python: "3.15t"
          - os: macos-latest
            python: "3.15t"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
          # for the 3.15 entries, which are a release candidate. it widens
          # resolution only where there is no final release to resolve to, so
          # the 3.13 and 3.14 entries are unaffected — and it comes **off** when
          # 3.15 ships rather than being left as a standing licence to test
          # against whatever is newest
          allow-prereleases: true
      # the agent is a cdylib nothing links, so `cargo test` never builds it —
      # it has to be built explicitly or the suite finds no agent to stage. on a
      # fresh checkout that fails loudly; on a machine that has built before it
      # would quietly test a stale agent, which is worse
      - run: cargo build -p bpd_agent
      # `bpd_test` discovers interpreters itself and fails loudly when none is
      # supported, so a job that silently tested nothing is not possible
      - run: cargo test --workspace --all-features

  agents:
    name: an agent per interpreter tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: |
            3.13
            3.14
      # every entry of the `test` matrix builds one agent and debugs the one
      # interpreter it matches. what no entry of it can reach is the thing an
      # installed bpd does: carry several, and choose. so this assembles the
      # layout out of real builds and launches each interpreter through it
      #
      # the last `cargo build -p bpd_agent` also leaves its artifact where a
      # checkout's development build sits, and it is 3.14's. that makes the
      # 3.13 launch below decisive rather than incidental: an agent chosen by
      # anything other than the tag is the 3.14 build, and 3.13 refuses it at
      # import
      - name: build an agent for each tag, into the layout bpd reads
        run: |
          set -euo pipefail
          for python in python3.13 python3.14; do
            PYO3_PYTHON=$python cargo build -p bpd_agent
            tag=$("$python" -c 'import sys, sysconfig; print("%d.%d%s" % (sys.version_info[0], sys.version_info[1], "t" if sysconfig.get_config_var("Py_GIL_DISABLED") else ""))')
            mkdir -p "target/debug/agents/$tag"
            cp target/debug/libbpd_agent.so "target/debug/agents/$tag/"
          done
      - run: cargo build --bin bpd
      - name: each interpreter is launched with the agent carried for its tag
        run: |
          set -euo pipefail
          for python in python3.13 python3.14; do
            ran=$(./target/debug/bpd launch --python "$python" -c 'print("the-program-ran")')
            test "$ran" = "the-program-ran"
          done

      # the layout above is assembled by this workflow, and a release is
      # assembled by `bpd-release`. those being two different things is how a
      # release comes to carry an agent under a name nothing looks for — which
      # assembles cleanly, verifies cleanly, and is invisible at every launch.
      # so the release path is built and driven here too
      #
      # **nothing is uploaded here.** this produces a directory, checks it is
      # what it says, and launches through it. uploading is `release.yaml`,
      # which runs on a `v*` tag and drives the same two commands on five
      # platforms — so what this job is really checking, on every push, is that
      # the release path still works
      - run: cargo build --bin bpd-release
      - name: a release layout is assembled, verified, and launched through
        run: |
          set -euo pipefail
          ./target/debug/bpd-release assemble \
            --binary target/debug/bpd \
            --agent 3.13=target/debug/agents/3.13/libbpd_agent.so \
            --agent 3.14=target/debug/agents/3.14/libbpd_agent.so \
            --out target/release-layout
          ./target/debug/bpd-release verify target/release-layout
          for python in python3.13 python3.14; do
            ran=$(./target/release-layout/bpd launch --python "$python" -c 'print("the-program-ran")')
            test "$ran" = "the-program-ran"
          done

      # and the same layout delivered by pip, which is the other way it reaches
      # a machine. the wheel is `py3-none-<platform>`: the binary links nothing
      # of cpython and the agents are loaded by the debuggee, so one wheel
      # carries every agent and installs into any supported interpreter
      #
      # the assertion is the one that matters and cannot be made against a zip:
      # a wheel installed into a **3.14** venv still debugs 3.13, because the
      # payload lands where agent resolution already looks — `scripts` becomes
      # `<prefix>/bin` and `data` becomes `<prefix>`, which are the two roots it
      # walks. a per-interpreter wheel would fail exactly this line
      #
      # **nothing is uploaded here** either. it builds a file, installs it, and
      # debugs through it
      - name: the layout is delivered as a wheel, installed, and debugged through
        run: |
          set -euo pipefail
          ./target/debug/bpd-release wheel \
            --layout target/release-layout \
            --version 0.0.0 \
            --platform linux_x86_64 \
            --out target/dist
          python3.14 -m venv target/wheel-venv
          ./target/wheel-venv/bin/pip install target/dist/*.whl
          test -x target/wheel-venv/bin/bpd
          for python in python3.13 python3.14; do
            ran=$(./target/wheel-venv/bin/bpd launch --python "$python" -c 'print("the-program-ran")')
            test "$ran" = "the-program-ran"
          done

  cross:
    name: cross-compile ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # no darwin entry: `macos-latest` in the `test` matrix compiles for it
        # natively, so a cross check from linux would answer a question already
        # answered. these two are the ones a developer on a mac cannot otherwise
        # ask without pushing
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: rustup target add ${{ matrix.target }}
      # `cargo check` needs the target's std and no linker, so one runner can
      # answer for every platform in minutes. that matters because the tree
      # carries over a hundred `cfg` sites — the fork handlers and the audit
      # event list are unix-only, the process cache path and `CreateProcess`
      # are windows-only — and a `cfg` arm that stopped compiling is invisible
      # to the platform it is not for. the `test` matrix below finds that too,
      # but only after installing an interpreter and running a whole suite
      #
      # `bpd_agent` is excluded because it is a cpython extension: pyo3 resolves
      # an interpreter **for the target** at build time, and there is not one
      # here. what that leaves unchecked is exactly the agent, which every
      # entry of the `test` matrix builds for real
      - run: cargo check --workspace --exclude bpd_agent --all-features --all-targets --target ${{ matrix.target }}

  vscode:
    name: vs code
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      # `@vscode/test-electron` declares node 22 or newer
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      # the extension is what makes bpd reachable from vs code at all, and no
      # rust test can reach it: `crates/bpd_dap/tests/vscode.rs` reads the
      # manifest off disk, which says nothing about whether vs code loads it or
      # whether the javascript runs. this job downloads a real vs code and
      # starts a real session through the extension, which is the only thing
      # that answers that
      #
      # it is its own job rather than a step of `test` because it needs node and
      # a 900 MB editor, and neither belongs in the matrix that runs on five
      # interpreter and platform combinations
      - run: cargo build -p bpd_agent
      - run: cargo build --bin bpd
      - run: npm ci
        working-directory: editors/vscode
      # vs code is an electron app and wants a display even with no window to
      # show. xvfb is the display, and `-a` picks a free one rather than
      # colliding with a server the runner already has
      #
      # `python` is the interpreter setup-python put first on PATH, which is
      # the one `cargo build -p bpd_agent` above compiled the agent against —
      # the runner has to name the same one twice or the agent will not import
      - run: xvfb-run -a npm test
        working-directory: editors/vscode
        env:
          BPD_PYTHON: python

  intellij:
    name: intellij
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      # the IntelliJ Platform 2026.2 is compiled for java 25, and `product-info.json`
      # refuses anything older
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: jetbrains
          java-version: "25"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          build-root-directory: editors/intellij
      # the plugin is what makes bpd reachable from a jetbrains IDE at all, and
      # no rust test can reach it: whether the platform loads the manifest,
      # whether its extension point registrations are accepted, and whether a
      # session started from a run configuration stops on a breakpoint are all
      # questions only a real IDE answers
      #
      # it is its own job rather than a step of `test` because it pulls a jvm
      # toolchain, gradle, and a 1.2 GB IDE, and none of that belongs in the
      # matrix that runs on five interpreter and platform combinations
      - run: cargo build -p bpd_agent
      - run: cargo build --bin bpd
      # the platform test framework runs headless — it is not an electron app
      # and wants no display, so unlike the `vscode` job there is no xvfb here
      #
      # `python` is the interpreter setup-python put first on PATH, which is the
      # one `cargo build -p bpd_agent` above compiled the agent against. the
      # runner has to name the same one twice or the agent will not import
      - run: ./gradlew test
        working-directory: editors/intellij
        env:
          BPD_EXECUTABLE: ${{ github.workspace }}/target/debug/bpd
          BPD_PYTHON: python
      # the manifest is checked against the platform it declares: an extension
      # point that moved, or an api that went away, is a plugin that installs
      # and does not load
      - run: ./gradlew verifyPluginStructure verifyPluginProjectConfiguration
        working-directory: editors/intellij

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          tool: cargo-llvm-cov
      # `cargo llvm-cov` runs `cargo test --tests`, which never produces a
      # `cdylib` that nothing links — so the agent would be missing and every
      # test that stages it would fail. `show-env` puts the instrumentation in
      # the environment instead, so the agent can be built first
      #
      # a welcome side effect: the debuggee inherits `LLVM_PROFILE_FILE`, so the
      # agent's coverage is collected from inside the python process that ran it
      #
      # `bpd_test` is excluded from the report. it is the harness, and covering
      # a harness measures nothing about the product
      #
      # the floor catches a change that adds a body of untested code. it sits
      # below the measured figure by enough to absorb the variation between a
      # runner with one interpreter and a machine with several
      - run: |
          eval "$(cargo llvm-cov show-env --sh)"
          cargo llvm-cov clean --workspace
          cargo build -p bpd_agent
          cargo test --workspace --all-features
          cargo llvm-cov report --summary-only \
            --ignore-filename-regex 'crates/bpd_test/' \
            --fail-under-lines 78

  bench:
    name: bench
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      # the overhead benchmark runs real programs under bpd, so it needs the
      # agent — and `cargo bench` builds in the release profile, where a plain
      # `cargo build` leaves nothing
      - run: cargo build --release -p bpd_agent
      # it compares against debugpy in the same interpreter, and refuses to run
      # without it rather than quietly dropping the comparison
      - run: python -m pip install debugpy
      # `--test` runs each benchmark once. this catches a benchmark that stops
      # compiling or panics; it deliberately does NOT gate on wall-clock numbers
      # from a shared runner, which vary by more than the effects worth catching
      - run: cargo bench --workspace --all-features -- --test

  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --group docs --locked
      - run: uv run --no-sync python scripts/check_docs_nav.py
      - run: uv run --no-sync zensical build --clean --strict
